concurrency:
  group: my-packages
  cancel-in-progress: true

on:
  push:
    paths:
      - '.github/workflows/merge.yml'
  schedule:
    - cron: '0 */13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: ''

      - name: 重置并清理工作区
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .git -e .github -e README.md -e .gitignore
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf jell_tmp tmp_jell .git/modules/* 2>/dev/null || true

      - name: 强制拉取最新代码
        run: |
          git pull --force --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

      - name: 设置 Git 和环境
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: 下载插件到根目录
        id: download
        shell: bash
        run: |
          set -uo pipefail
          
          DOWNLOAD_DIR=$(mktemp -d)
          trap "rm -rf $DOWNLOAD_DIR" EXIT
          
          git_clone() {
            local repo="$1"
            local dir="$2"
            local target="${DOWNLOAD_DIR}/${dir}"
            echo "🔄 正在克隆: $dir"
            if git clone --depth 1 "$repo" "$target" 2>&1; then
              echo "✅ 成功克隆: $dir"
              return 0
            else
              echo "⚠️ 警告: 克隆 $dir 失败，跳过"
              return 1
            fi
          }
          
          declare -A REPOS
          REPOS=(
            ["luci-app-dnsfilter"]="https://github.com/kiddin9/luci-app-dnsfilter"
            ["aria2"]="https://github.com/kiddin9/aria2"
            ["autoshare"]="https://github.com/kiddin9/autoshare"
            ["luci-app-wizard"]="https://github.com/kiddin9/luci-app-wizard"
            ["openwrt-iptvhelper"]="https://github.com/riverscn/openwrt-iptvhelper"
            ["luci-app-timedreboot"]="https://github.com/kongfl888/luci-app-timedreboot"
            ["OpenAppFilter"]="https://github.com/destan19/OpenAppFilter"
            ["luci-app-tcpdump"]="https://github.com/upcliujie/luci-app-tcpdump"
            ["luci-app-sqm-controller"]="https://github.com/Natduki/luci-app-sqm-controller"
            ["luci-app-trafficctl"]="https://github.com/YusDyr/luci-app-trafficctl"
            ["luci-app-timecontrol"]="https://github.com/sirpdboy/luci-app-timecontrol"
            ["luci-app-advancedplus"]="https://github.com/sirpdboy/luci-app-advancedplus"
            ["luci-app-partexp"]="https://github.com/sirpdboy/luci-app-partexp"
            ["netspeedtest"]="https://github.com/sirpdboy/netspeedtest"
            ["luci-app-watchdog"]="https://github.com/sirpdboy/luci-app-watchdog"
            ["luci-app-parentcontrol"]="https://github.com/sirpdboy/luci-app-parentcontrol"
            ["luci-app-eqosplus"]="https://github.com/sirpdboy/luci-app-eqosplus"
            ["luci-app-taskplan"]="https://github.com/sirpdboy/luci-app-taskplan"
            ["luci-app-netwizard"]="https://github.com/sirpdboy/luci-app-netwizard"
            ["luci-app-lucky"]="https://github.com/gdy666/luci-app-lucky"
            ["luci-app-wrtbwmon"]="https://github.com/brvphoenix/luci-app-wrtbwmon"
            ["wrtbwmon"]="https://github.com/brvphoenix/wrtbwmon"
            ["luci-app-mosdns"]="https://github.com/sbwml/luci-app-mosdns"
            ["luci-app-unblockneteasemusic"]="https://github.com/UnblockNeteaseMusic/luci-app-unblockneteasemusic"
            ["luci-app-quickfile"]="https://github.com/sbwml/luci-app-quickfile"
            ["luci-app-adblock-fast"]="https://github.com/mossdef-org/luci-app-adblock-fast"
            ["luci-app-wechatpush"]="https://github.com/tty228/luci-app-wechatpush"
            ["speedtest-web"]="https://github.com/ZeaKyX/speedtest-web"
            ["luci-app-speedtest-web"]="https://github.com/ZeaKyX/luci-app-speedtest-web"
            ["OpenClash"]="https://github.com/vernesong/OpenClash"
            ["luci-app-ikoolproxy"]="https://github.com/ilxp/luci-app-ikoolproxy"
            ["luci-app-easytier"]="https://github.com/EasyTier/luci-app-easytier"
            ["rtp2httpd"]="https://github.com/stackia/rtp2httpd"
            ["luci-app-argon-config"]="https://github.com/jerrykuku/luci-app-argon-config"
            ["luci-theme-argon"]="https://github.com/jerrykuku/luci-theme-argon"
            ["luci-app-pushbot"]="https://github.com/gaoyaxuan/luci-app-pushbot"
            ["luci-app-netstat"]="https://github.com/nooblk-98/luci-app-netstat"
            ["luci-theme-noobwrt"]="https://github.com/nooblk-98/luci-theme-noobwrt"
            ["luci-app-adguardhome"]="https://github.com/kenzok78/luci-app-adguardhome"
            ["luci-app-smartdns"]="https://github.com/pymumu/luci-app-smartdns"
            ["smartdns"]="https://github.com/pymumu/openwrt-smartdns"
            ["openwrt-passwall"]="https://github.com/Openwrt-Passwall/openwrt-passwall"
            ["luci-app-bandix"]="https://github.com/timsaya/luci-app-bandix"
            ["openwrt-bandix"]="https://github.com/timsaya/openwrt-bandix"
            ["luci-app-bandix-plus"]="https://github.com/timsaya/luci-app-bandix-plus"
            ["openwrt-bandix-plus"]="https://github.com/timsaya/openwrt-bandix-plus"
            ["luci-app-netwiz"]="https://github.com/huchd0/luci-app-netwiz"
            ["luci-app-minigate"]="https://github.com/tpxcer/luci-app-minigate"
          )
          
          special_downloads() {
            echo "🔄 处理特殊仓库: vlmcsd"
            if tmpdir=$(mktemp -d); then
              if git clone --depth 1 https://github.com/gaoderby/luci-app-kms "$tmpdir/kms" 2>/dev/null; then
                cp -r "$tmpdir/kms/luci/applications/luci-app-vlmcsd" "${DOWNLOAD_DIR}/luci-app-vlmcsd" 2>/dev/null || true
                cp -r "$tmpdir/kms/package/network/vlmcsd" "${DOWNLOAD_DIR}/vlmcsd" 2>/dev/null || true
                echo "✅ 成功处理: vlmcsd"
              else
                echo "⚠️ 警告: 处理 vlmcsd 失败"
              fi
              rm -rf "$tmpdir"
            fi
            
            echo "🔄 处理特殊仓库: adblock-fast"
            if tmpdir=$(mktemp -d); then
              if git clone --depth 1 https://github.com/openwrt/packages "$tmpdir/packages" 2>/dev/null; then
                cp -r "$tmpdir/packages/net/adblock-fast" "${DOWNLOAD_DIR}/adblock-fast" 2>/dev/null || true
                echo "✅ 成功处理: adblock-fast"
              else
                echo "⚠️ 警告: 处理 adblock-fast 失败"
              fi
              rm -rf "$tmpdir"
            fi
            
            echo "🔄 处理特殊仓库: jell"
            if tmpdir=$(mktemp -d); then
              if git clone --depth 1 https://github.com/kenzok8/jell "$tmpdir/jell" 2>/dev/null; then
                for item in luci-app-aria2 luci-app-ipsec-server luci-app-pptpd webdav2 luci-app-msd_lite luci-app-onliner msd_lite unishare luci-app-unishare luci-app-rtbwmon luci-app-kodexplorer; do
                  if [ -d "$tmpdir/jell/$item" ]; then
                    cp -r "$tmpdir/jell/$item" "${DOWNLOAD_DIR}/$item"
                  fi
                done
                echo "✅ 成功处理: jell"
              else
                echo "⚠️ 警告: 处理 jell 失败"
              fi
              rm -rf "$tmpdir"
            fi
            
            return 0
          }
          
          batch1_keys=(
            "luci-app-dnsfilter" "aria2" "autoshare" "luci-app-wizard" 
            "openwrt-iptvhelper" "luci-app-timedreboot" "OpenAppFilter" 
            "luci-app-tcpdump" "luci-app-sqm-controller" "luci-app-trafficctl"
          )
          
          batch2_keys=(
            "luci-app-timecontrol" "luci-app-advancedplus" "luci-app-partexp" 
            "netspeedtest" "luci-app-watchdog" "luci-app-parentcontrol" 
            "luci-app-eqosplus" "luci-app-taskplan" "luci-app-netwizard" "luci-app-lucky"
          )
          
          batch3_keys=(
            "luci-app-wrtbwmon" "wrtbwmon" "luci-app-mosdns" 
            "luci-app-unblockneteasemusic" "luci-app-quickfile" "luci-app-adblock-fast" 
            "luci-app-wechatpush" "speedtest-web" "luci-app-speedtest-web" "OpenClash"
          )
          
          batch4_keys=(
            "luci-app-cpu-status" "luci-app-ikoolproxy" "luci-app-easytier" 
            "rtp2httpd" "luci-app-argon-config" "luci-theme-argon" 
            "luci-app-pushbot" "luci-app-netstat" "luci-theme-noobwrt" "luci-app-tinyfilemanager"
          )
          
          batch5_keys=(
            "luci-app-adguardhome" "luci-app-smartdns" "smartdns" 
            "openwrt-passwall2" "openwrt-passwall" "luci-app-bandix" 
            "openwrt-bandix" "luci-app-bandix-plus" "openwrt-bandix-plus" 
            "luci-app-netwiz" "luci-app-minigate" "luci-app-mosdns-panel"
          )
          
          echo "🚀 开始并行下载..."
          
          (
            for key in "${batch1_keys[@]}"; do
              git_clone "${REPOS[$key]}" "$key" || true
            done
          ) &
          PID1=$!
          
          (
            for key in "${batch2_keys[@]}"; do
              git_clone "${REPOS[$key]}" "$key" || true
            done
          ) &
          PID2=$!
          
          (
            for key in "${batch3_keys[@]}"; do
              git_clone "${REPOS[$key]}" "$key" || true
            done
          ) &
          PID3=$!
          
          (
            for key in "${batch4_keys[@]}"; do
              git_clone "${REPOS[$key]}" "$key" || true
            done
          ) &
          PID4=$!
          
          (
            for key in "${batch5_keys[@]}"; do
              git_clone "${REPOS[$key]}" "$key" || true
            done
          ) &
          PID5=$!
          
          (special_downloads) &
          PID6=$!
          
          echo "⏳ 等待所有下载任务完成..."
          wait $PID1 $PID2 $PID3 $PID4 $PID5 $PID6
          
          echo "📊 所有下载任务已完成"
          echo "📦 下载目录内容:"
          ls -la "$DOWNLOAD_DIR" || echo "下载目录为空或不存在"
          
          echo "🧹 清理旧文件..."
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'README.md' ! -name '.gitignore' -exec rm -rf {} + 2>/dev/null || true
          
          if [ -d "$DOWNLOAD_DIR" ] && [ "$(ls -A "$DOWNLOAD_DIR" 2>/dev/null)" ]; then
            echo "📁 移动新文件到工作目录..."
            shopt -s dotglob
            for item in "$DOWNLOAD_DIR"/*; do
              if [ -e "$item" ]; then
                cp -r "$item" . 2>/dev/null || true
              fi
            done
            shopt -u dotglob
          else
            echo "⚠️ 警告: 下载目录为空，可能所有下载都失败了"
          fi
          
          echo "🧹 清理子目录中的 .git 文件夹..."
          find . -mindepth 2 -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          find . -mindepth 2 -type f -name "README.md" ! -path "./README.md" -delete 2>/dev/null || true
          find . -mindepth 2 -type f -name "LICENSE" -delete 2>/dev/null || true
          
          echo "✅ 下载完成"
          echo "当前目录内容："
          ls -la

      - name: 提交并推送更新
        run: |
          if [ ! -d ".git" ]; then
            echo "❌ 错误：.git 目录不存在"
            exit 1
          fi
          
          CHANGES=$(git status --porcelain)
          
          if [ -z "$CHANGES" ]; then
            echo "ℹ️ 无文件变更，跳过提交"
            exit 0
          fi
          
          echo "📤 检测到更新："
          echo "$CHANGES"
          
          UPDATE_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          FILE_COUNT=$(echo "$CHANGES" | wc -l)
          
          PLUGINS=$(echo "$CHANGES" | awk '{print $2}' | grep -v '^README.md$' | sed 's|^\./||' | cut -d'/' -f1 | sort -u | grep -v '^$' | sed 's/^/  - `/; s/$/`/')
          
          cat > README.md << EOF
          ## 📦 自用包自动更新
          
          - **更新时间**：${UPDATE_TIME}
          - **更新文件数**：${FILE_COUNT}
          - **更新插件**：
          ${PLUGINS:-  - 配置文件更新}
          
          ---
          
          本仓库由 GitHub Actions 自动维护，每13小时检查一次更新。
          EOF
          
          git add -A
          git commit -m "📦 自动更新 - ${UPDATE_TIME}" || exit 0
          
          for i in 1 2 3; do
            if git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main; then
              echo "✅ 推送成功"
              exit 0
            fi
            echo "⚠️ 推送失败，${i}/3 重试..."
            sleep 5
            git fetch origin main && git rebase origin/main || true
          done
          
          echo "❌ 推送失败"
          exit 1
